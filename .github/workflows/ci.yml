name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Dev tooling (Vitest 5, ESLint 10, Vite) requires Node.js 22.12+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run verify:exports
      - if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  runtime:
    name: Runtime (Node ${{ matrix.node }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The published package supports Node.js 18+ ("engines"); verify the built output there.
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke-runtime.mjs
